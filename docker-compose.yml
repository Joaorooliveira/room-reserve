services:
  postgres:
    image: postgres:16
    container_name: room-reserve-postgres

    environment:
      POSTGRES_DB: room-reserve
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: